[project]
name = "quantiles-tau3-airline-example"
version = "0.1.0"
description = "Minimal Quantiles custom_code adapter for the tau3 airline benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "quantiles",
  "tau2",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10.0.0",
  "ruff>=0.15.12,<0.16.0",
]

[tool.uv.sources]
quantiles = { path = "../../../../python", editable = true }
tau2 = { git = "https://github.com/sierra-research/tau2-bench.git", tag = "v1.0.1" }

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
