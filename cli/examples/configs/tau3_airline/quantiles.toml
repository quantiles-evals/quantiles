# This example intentionally defaults to one task and one trial. Both the agent
# and user simulator call the configured provider model, so a real run can incur
# provider charges.

[benchmarks.tau3-airline]
type = "custom_code"
command = ["uv", "run", "python", "tau3_airline.py"]

[benchmarks.tau3-airline.input]
data_dir = ".tau3/tau2-bench/data"
agent_model = "openai:gpt-4.1"
user_model = "openai:gpt-4.1"
num_tasks = 1
num_trials = 1
max_steps = 100
max_concurrency = 1
seed = 300
